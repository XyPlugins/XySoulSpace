# ============================================================
# XySoulSpace 1.1.10
# Paper/Spigot 1.12.2
#
# 当前版本默认使用本地 YML 存储，后续可切换到 XyCore/SQL 存储。
# ============================================================

storage:
  # 当前可用: yaml
  # 预留: xcore, mysql
  type: yaml
  autosave-interval-ticks: 1200
  save-on-deposit: false

integrations:
  xcore:
    enabled: true
  mythicmobs:
    enabled: true
    debug: false
    # 兼容旧 SoulSpace 的怪物配置字段：
    # ZombieExample:
    #   ssdrops:
    #     - "xyitems:chiyamopo 1 100%"
    #     - "mythicmobs:ForgingCrystal 2 0.25"
  vault:
    enabled: true
  playerpoints:
    enabled: true

pickup:
  # 全局总开关。关闭后事件拾取、范围扫描和MythicMobs ssdrops均不会直接入库。
  global-enabled: true
  # 新玩家首次生成灵魂空间数据时的个人开关默认值。
  default-player-enabled: true
  # 范围扫描的三个方向半径，单位为方块；运行时最高限制为64，避免误配置拖慢主线程。
  range: 6.0
  # 复用一个全服扫描任务；数值越小检查越频繁，正式服建议不要低于默认值10。
  scan-interval-ticks: 10
  # 是否向玩家发送自动拾取成功提示。
  notification-enabled: true
  # 相同玩家、相同物品在该时间窗口内合并为一条提示，单位为tick。
  notification-merge-ticks: 10
  # 可用变量：%item%、%item_name%、%item_id%、%amount%。
  notification-message: "&a已自动拾取 &r%item% &7x%amount% &a进入灵魂仓库"

gui:
  title: "&a灵魂空间"
  admin-title: "&6[管理] %player% 的灵魂空间"
  size: 54
  items-per-page: 45
  # 是否在GUI物品Lore中显示灵魂数量。
  show-amount-lore: true
  # 是否在GUI物品Lore中显示取出操作提示。
  # 该提示只存在于GUI展示副本中，不会写入真实取出物品。
  show-action-lore: true
  # 是否在GUI物品Lore中显示内部Key。
  # 正式服建议保持false，Key只用于插件内部识别。
  show-key-lore: false
  previous-page-material: FEATHER
  next-page-material: FEATHER
  store-button-material: EMERALD
  decompose-button-material: BLAZE_POWDER
  # GUI第51号槽的个人自动拾取按钮材质。
  pickup-enabled-button-material: EMERALD
  pickup-disabled-button-material: REDSTONE
  # 管理员关闭全局自动拾取时显示的只读状态材质。
  pickup-global-disabled-button-material: BARRIER
  close-button-material: BARRIER

quick-decompose:
  enabled: true
  items:
    - lore: "分解可获得中阶斗兽晶核"
      commands:
        - "mm i give %player% 中阶斗兽晶核 1"
    - lore:
        - "十年斗环"
        - "百年斗环"
        - "千年斗环"
      commands:
        - "mm i give %player% 中阶斗兽晶核 1"
        - "points give %player% 200"

messages:
  # 独立运行时使用本前缀；检测到 XyCore 时，玩家聊天提示优先使用 XyCore config.yml -> messages.prefix。
  prefix: "&7[&bXySoulSpace&7]&r "
  # 玩家消息中%item%的显示方式。
  # id = XyItems/MythicMobs显示完整物品ID；原版minecraft物品优先使用下方中文名映射。
  # raw-id = 严格显示完整物品ID，例如 minecraft:BEACON。
  # name/display = 优先显示物品自定义显示名；没有显示名时再使用原版中文名或完整ID。
  item-name-mode: "id"
  # 原版物品的玩家提示显示名覆盖表。
  # 插件已经内置1.12.2基础Material中文名；这里仅用于覆盖你想自定义的叫法。
  vanilla-names:
    BEACON: "信标"
    IRON_INGOT: "铁锭"
    GOLD_INGOT: "金锭"
    DIAMOND: "钻石"
    EMERALD: "绿宝石"
    GLOWSTONE_DUST: "萤石粉"
    BLAZE_POWDER: "烈焰粉"
    ANVIL: "铁砧"
    CHEST: "箱子"
    BARRIER: "屏障"
  no-permission: "&c你没有权限执行此操作"
  only-player: "&c该命令仅玩家可用"
  reload: "&a配置、商店、物品库和自动拾取规则已重载"
  stored: "&a已存入 &f%amount% &a个 &r%item% &a到灵魂空间"
  withdrawn: "&a已取出 &f%amount% &a个 &r%item%"
  inventory-full: "&c背包空间不足"
  empty: "&7灵魂空间暂无物品"
  pickup-on: "&a个人自动拾取已开启"
  pickup-off: "&c个人自动拾取已关闭"
  pickup-global-disabled: "&c服务器当前已停用自动拾取"
  global-pickup-on: "&a全局自动拾取已开启"
  global-pickup-off: "&c全局自动拾取已关闭"
  player-not-found: "&c玩家不在线或不存在"
  storage-cleared: "&a已清空 %player% 的灵魂空间"
  item-library-saved: "&a已保存手中物品为 &e%id%"
  item-library-missing: "&c物品库中不存在 &e%id%"
  item-library-given: "&a已向 %player% 的灵魂空间发放 &f%amount% &a个 &e%id%"
